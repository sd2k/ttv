[package]
name = "ttv"
description = "Create train, test and validation sets from text files"
version = "0.4.0"
authors = ["Ben Sully <ben@bsull.io>"]
repository = "https://github.com/sd2k/ttv"
keywords = ["cli", "data", "machine-learning"]
readme = "README.md"
edition = "2021"
license = "MIT/Apache-2.0"

[dependencies]
clap = { version = "3.1.15", features = ["derive", "yaml"] }
csv = "1.4.0"
env_logger = "0.11.6"
flate2 = "1.1.9"
indicatif = "0.18.4"
jemallocator = "0.5.4"
log = "0.4.29"
rand = "0.9.4"
rand_chacha = "0.10.0"
rayon = "1.12.0"
thiserror = "2.0.18"

[dev-dependencies]
trycmd = "0.15.10"
